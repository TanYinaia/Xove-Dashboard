<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Dashboard · 设计令牌游乐场</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* 编辑器自身样式（不影响插件），全部以 .tp- 前缀 */
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-interface, -apple-system, "Segoe UI", "PingFang SC", sans-serif);
    background: #0b0c10; color: #e8e6e0;
  }
  .tp-top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: #15171f; border-bottom: 1px solid #2a2d39;
    position: sticky; top: 0; z-index: 10;
  }
  .tp-top h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  .tp-seg { display: flex; gap: 4px; background: #0e0f14; padding: 3px; border-radius: 9px; border: 1px solid #2a2d39; }
  .tp-seg button { padding: 5px 12px; border: none; background: transparent; color: #9a9aa8; font-size: 13px; border-radius: 7px; cursor: pointer; }
  .tp-seg button.active { background: #3B6FE0; color: #fff; }
  .tp-spacer { flex: 1; }
  .tp-btn2 { padding: 6px 12px; border-radius: 8px; border: 1px solid #2a2d39; background: #1d2029; color: #e8e6e0; font-size: 13px; cursor: pointer; }
  .tp-btn2:hover { background: #262a36; }
  .tp-btn2.primary { background: #22d3bb; border-color: #22d3bb; color: #06231f; font-weight: 600; }
  .tp-main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; height: calc(100vh - 58px); }
  .tp-stage-wrap { flex: 1; min-width: 0; overflow: auto; background: #0e0f14; border: 1px solid #23262f; border-radius: 12px; }
  .tp-wrap { width: 100%; min-height: 100%; }
  .tp-preview { max-width: 1100px; margin: 0 auto; }
  .tp-side { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .tp-box { background: #15171f; border: 1px solid #2a2d39; border-radius: 12px; padding: 12px; }
  .tp-box h2 { font-size: 13px; margin: 0 0 10px; color: #9a9aa8; font-weight: 600; letter-spacing: .03em; }
  .tp-hint { font-size: 11px; color: #6b6b7b; margin-bottom: 10px; line-height: 1.5; }

  /* 变量控制行 */
  .tp-ctrl { display: grid; grid-template-columns: 92px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 7px; }
  .tp-ctrl__name { font-size: 11px; color: #c8c8d0; font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-inp { display: flex; align-items: center; gap: 5px; }
  .tp-inp input[type=color] { width: 26px; height: 24px; padding: 0; border: 1px solid #2a2d39; border-radius: 5px; background: none; cursor: pointer; flex-shrink: 0; }
  .tp-tx { width: 100%; min-width: 0; padding: 3px 5px; border-radius: 6px; border: 1px solid #2a2d39; background: #0e0f14; color: #e8e6e0; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .tp-inp input[type=range] { flex: 1; min-width: 0; }
  .tp-rv { font-size: 10px; color: #9a9aa8; min-width: 34px; text-align: right; font-family: ui-monospace, Menlo, monospace; }
  .tp-inp input:disabled { opacity: .4; }

  textarea {
    width: 100%; min-height: 220px; resize: vertical; border-radius: 8px; border: 1px solid #2a2d39;
    background: #0e0f14; color: #b6f0e4; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; padding: 8px;
  }
  #tp-flash {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #22d3bb; color: #06231f; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 50;
  }
  #tp-flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 预览组件（用插件令牌，确保实时反映） ===== */
  .tp-preview { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  /* banner 比例改由令牌驱动，预览即时生效 */
  .tp-wrap .ad-banner, .tp-wrap .ad-modal__preview { aspect-ratio: var(--ad-banner-ar); }
  .ad-banner__ph { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ad-text-mute); font-size: 13px; background: var(--ad-s2); }
  .tp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tp-stat { background: var(--ad-s1); border: 1px solid var(--ad-line); border-radius: var(--ad-r2); padding: 12px 14px; }
  .tp-stat__v { font-size: 22px; font-weight: 700; color: var(--ad-text); letter-spacing: .04em; }
  .tp-stat__l { font-size: 10px; color: var(--ad-text-dim); margin-top: 2px; }
  .tp-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tp-card { margin: 0; }
  .tp-line { font-size: 12px; color: var(--ad-text); padding: 3px 0 3px 8px; border-left: 2px solid transparent; }
  .tp-line--overdue { color: var(--ad-danger); border-left-color: var(--ad-danger); font-weight: 600; }
  .tp-muted { font-size: 11px; color: var(--ad-text-dim); margin-top: 6px; }
  .tp-badge { display: inline-block; font-size: 11px; color: #fff; background: var(--ad-danger); border-radius: 20px; padding: 2px 9px; margin-bottom: 6px; font-weight: 600; }
  .tp-ring { display: flex; align-items: center; gap: 12px; }
  .tp-ring__num { font-size: 18px; font-weight: 700; color: var(--ad-accent); }
  .tp-stages { display: flex; gap: 6px; margin-bottom: 6px; }
  .tp-pip { width: 22px; height: 6px; border-radius: 4px; background: var(--ad-line); }
  .tp-pip--done { background: var(--ad-success); }
  .tp-pip--active { background: var(--ad-accent); }
  .tp-big { font-size: 30px; font-weight: 800; color: var(--ad-text); }
  .tp-hm { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
  .tp-hm > div { aspect-ratio: 1; }
  .tp-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .tp-day { border: 1px solid var(--ad-line); border-radius: var(--ad-r1); padding: 4px 5px; font-size: 11px; color: var(--ad-text-mute); min-height: 30px; }
  .tp-day--overdue { background: var(--ad-danger); color: #fff; border-color: var(--ad-danger); font-weight: 600; }
  .tp-day--done { background: var(--ad-s2); color: var(--ad-text-dim); text-decoration: line-through; opacity: .7; }
  .tp-kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tp-kcol { background: var(--ad-s2); border-radius: var(--ad-r2); padding: 7px; }
  .tp-kcol__h { font-size: 11px; color: var(--ad-text-dim); margin-bottom: 6px; }
  .tp-kcard { background: var(--ad-s1); border: 1px solid var(--ad-line); border-radius: var(--ad-r1); padding: 6px 8px; font-size: 11px; color: var(--ad-text); margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="tp-top">
    <h1>🎨 设计令牌游乐场</h1>
    <div class="tp-seg">
      <button id="tp-md" class="active">🌙 深色</button>
      <button id="tp-ml">☀ 浅色</button>
      <button id="tp-ms">⬓ 并排</button>
    </div>
    <div class="tp-spacer"></div>
    <button class="tp-btn2" id="tp-reset">↺ 重置</button>
    <button class="tp-btn2 primary" id="tp-export">⤓ 生成 CSS</button>
  </div>

  <div class="tp-main">
    <div class="tp-stage-wrap">
      <div id="tp-stage"></div>
    </div>
    <div class="tp-side">
      <div class="tp-box">
        <h2>设计变量（实时编辑）</h2>
        <div id="tp-panel"></div>
      </div>
      <div class="tp-box">
        <h2>导出 CSS（预览 → 审批后由助手落地）</h2>
        <textarea id="tp-out" readonly placeholder="点击右上「生成 CSS」…"></textarea>
      </div>
    </div>
  </div>

  <div id="tp-flash"></div>
  <script src="token-playground.js"></script>
</body>
</html>
